[package]
build = "../../../brand/build.rs"
name = "memoswish-mcp"
description = "Model Context Protocol gateway for Memoswish: lets AI agents manage content, BGM and TTS over stdio or Streamable HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
mcp-oauth = ["memoswish-auth/mcp-oauth"]
# 已弃用的兼容别名；保留原有 auth 能力集合。
commercial-saas = ["mcp-oauth", "memoswish-auth/commercial-saas"]

[dependencies]
rmcp.workspace = true
futures.workspace = true
tokio-util.workspace = true
memoswish-application.workspace = true
memoswish-core.workspace = true
memoswish-protocol.workspace = true
memoswish-auth.workspace = true
memoswish-content.workspace = true
memoswish-media.workspace = true
axum.workspace = true
base64.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
http-body-util.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tower.workspace = true
async-trait.workspace = true
memoswish-feed.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
zip.workspace = true
memoswish-storage = { workspace = true, features = ["sqlite"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
