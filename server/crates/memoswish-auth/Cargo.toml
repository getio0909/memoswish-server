[package]
build = "../../../brand/build.rs"
name = "memoswish-auth"
description = "Authentication (JWT, API tokens), RBAC enforcement, multi-tenant bootstrap and quota policies for Memoswish."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["self-hosted"]
# 开源自托管：无限配额。
self-hosted = []
# 仅供跨 crate 回归暂停已完成的口令证明，默认生产构建不启用。
test-support = []
# 认证能力独立于付费套餐策略；两个流程复用相同的密码学辅助函数。
mcp-oauth = ["dep:subtle"]
oidc = ["dep:subtle", "dep:openidconnect", "dep:reqwest", "dep:aes-gcm", "dep:serde_json"]
commercial-quota = []
# 已弃用的兼容别名；OSS 1.x 保留原有认证及付费策略集合。
commercial-saas = ["mcp-oauth", "oidc", "commercial-quota"]

[dependencies]
openidconnect = { workspace = true, optional = true }
governor.workspace = true
aes-gcm = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio.workspace = true
serde_json = { workspace = true, optional = true }
base64.workspace = true
url.workspace = true
subtle = { workspace = true, optional = true }
getrandom.workspace = true
memoswish-core.workspace = true
memoswish-protocol.workspace = true
argon2.workspace = true
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
memoswish-storage = { workspace = true, features = ["sqlite"] }
tokio.workspace = true

[lints]
workspace = true
